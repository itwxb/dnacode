<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101411" media="(prefers-color-scheme: dark)">
  <title>404 — 页面不存在 | DNACode</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f6f1, #101411);
      --fg: light-dark(#171d18, #f0f4ec);
      --muted: light-dark(#68716a, #a0aaa1);
      --line: light-dark(#dfe5dc, #2a332c);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    main { padding: 48px 24px; max-width: 600px; }
    .code { font: 800 14px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: light-dark(#4d7629, #c5f47b); letter-spacing: .14em; }
    h1 { font-size: 30px; letter-spacing: -.04em; margin: 18px 0 10px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.95; margin: 0 0 28px; max-width: 460px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 700; text-decoration: none; }
    a.primary { background: #172019; color: #f8fbf5; }
    a.secondary { border: 1px solid var(--line); color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <div class="code">404 NOT FOUND</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者地址输入有误。你可以回到首页，或查看 English 版本。</p>
    <div class="actions">
      <a class="primary" href="/">返回首页</a>
      <a class="secondary" href="/en/">English home</a>
    </div>
  </main>
</body>
</html>
