name: Release

# 触发方式：
#   1) 推送 v* 标签（正式版本流程）
#   2) 向 release 分支推送任意提交（用于重跑发布构建，自动使用 package.json 版本号）
#   3) 手动 workflow_dispatch（可选指定 tag）
# 所有触发方式都只会创建/更新“草稿 Release”，正式发布必须在 GitHub 上人工确认。
on:
  push:
    tags: ["v*"]
    branches: ["release"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布使用的标签（留空则自动使用 v<package.json 版本>）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: Windows x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            label: macOS (Apple Silicon)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            label: Linux x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # 每个平台只打包自己支持的安装器（nsis / dmg / deb+appimage），
      # 避免把 tauri.conf.json 里的 Windows 默认目标带到其他平台。
      # 产物上传到草稿 Release，正式发布需在 GitHub 上人工确认。
      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: "DNACode ${{ steps.rel.outputs.tag }}"
          releaseBody: "详细变更见仓库中的 CHANGELOG.md。"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
