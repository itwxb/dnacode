name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DNACode 的产品原则是「少即是多」：新增功能前请先说明它是否服务于核心流程
        （打开项目 → 查看/编辑 → 审查 Git 变更 → 提交推送）。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 使用场景
      description: 描述真实场景，而不是先给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，未发现相同建议
          required: true
